name: Playwright Daily Test

on:
  schedule:
    # Jam 08:00 WIB = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest
          playwright install --with-deps

      - name: Run Python Script
        run: |
          python run_test.py

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Report Test Playwright - Status: ${{ job.status }}"
          to: ${{ secrets.EMAIL_TO }}
          from: "GitHub Actions Automation"
          body: |
            Halo, 
            
            Eksekusi Automated Test Playwright telah selesai dijalankan secara otomatis.
            Status Akhir: ${{ job.status }}
            
            Detail Log dapat dilihat di sini: 
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
